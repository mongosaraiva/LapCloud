# Immich: photo and video library.
# Immich runs its OWN Postgres (it needs the VectorChord extension, which is
# not in the shared core/postgres image). Reached through Caddy at
# http://photos.<LAPCLOUD_DOMAIN>

name: lapcloud-immich

services:
  immich-server:
    container_name: lapcloud-immich-server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3}
    env_file: .env
    volumes:
      - ${UPLOAD_LOCATION:-./data/library}:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - redis
      - database
    restart: unless-stopped
    healthcheck:
      disable: false
    networks:
      - default
      - lapcloud
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  immich-machine-learning:
    container_name: lapcloud-immich-ml
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3}
    env_file: .env
    volumes:
      - ./data/model-cache:/cache
    restart: unless-stopped
    healthcheck:
      disable: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    container_name: lapcloud-immich-redis
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: unless-stopped

  database:
    container_name: lapcloud-immich-postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # Uncomment if the database is NOT on an SSD
      # DB_STORAGE_TYPE: "HDD"
    volumes:
      - ${DB_DATA_LOCATION:-./data/postgres}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped
    healthcheck:
      disable: false

networks:
  lapcloud:
    external: true
