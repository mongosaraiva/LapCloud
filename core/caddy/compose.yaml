# Caddy reverse proxy: gives each app a friendly name, e.g. http://photos.lapcloud.lan
# Home use only, so it serves plain HTTP (no certificates).
# Each app has one small file in ./sites/. Delete the ones you do not use.

services:
  caddy:
    image: caddy:2-alpine
    container_name: lapcloud-caddy
    restart: unless-stopped
    env_file: .env
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - ./data/caddy-data:/data
      - ./data/caddy-config:/config
    networks:
      lapcloud:
        # Other containers (for example Immich asking Authentik to log you in)
        # must open the same names your browser uses. These aliases make Docker
        # send those names to Caddy. Keep this list in step with ./sites/.
        aliases:
          - auth.${LAPCLOUD_DOMAIN:-lapcloud.lan}
          - photos.${LAPCLOUD_DOMAIN:-lapcloud.lan}
          - jellyfin.${LAPCLOUD_DOMAIN:-lapcloud.lan}
          - videos.${LAPCLOUD_DOMAIN:-lapcloud.lan}
          - audiobooks.${LAPCLOUD_DOMAIN:-lapcloud.lan}
          - books.${LAPCLOUD_DOMAIN:-lapcloud.lan}
          - music.${LAPCLOUD_DOMAIN:-lapcloud.lan}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  lapcloud:
    external: true
